services:
  - type: web
    name: popov-toy-museum
    runtime: python
    buildCommand: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 && pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: FLASK_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CLIP_MODEL_NAME
        value: openai/clip-vit-base-patch32
      - key: PHOTO_MATCH_THRESHOLD
        value: "0.82"
      - key: CLIP_DUPLICATE_THRESHOLD
        value: "0.965"
