services:
  - type: web
    name: popov-toy-museum
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        value: https://popov-toy-museum.onrender.com
      - key: ADMIN_KEY
        sync: false
      - key: FLASK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
