<div class="grid">{% for t in toys %}<a class="toy" href="/toy/{{t.id}}"><div class="thumb">{% if t.image_path %}<img src="/photos/{{t.image_path}}" alt="">{% else %}✦{% endif %}</div><div class="toyinfo"><small>{{t.inventory_number}}</small><h3>{{t.name or 'Без названия'}}</h3><p>{{t.brand or 'Бренд не указан'}} · {{t.height or 'Размер не указан'}}</p></div></a>{% else %}<div class="empty">Экспонатов пока нет. Добавьте фотографии через панель хранителя.</div>{% endfor %}</div>
