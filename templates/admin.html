<!doctype html><html lang="ru"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="admin"><h1>Паспорт хранителя</h1><form action="/admin/upload" method="post" enctype="multipart/form-data" class="panel"><input type="file" name="photos" multiple accept="image/*"><button class="primary">Добавить фотографии</button></form>{% for x in toys %}<form action="/admin/toy/{{x.id}}" method="post" class="panel"><b>{{x.inventory_num}} · {{x.title}}</b><input name="title" value="{{x.title}}" placeholder="Название"><input name="brand" value="{{x.brand or ''}}" placeholder="Бренд"><input name="format" value="{{x.format or ''}}" placeholder="Размер / формат"><input name="height_cm" value="{{x.height_cm or ''}}" placeholder="Высота, см"><input name="material" value="{{x.material or ''}}" placeholder="Материал"><input name="year" value="{{x.year or ''}}" placeholder="Год"><input name="production_country" value="{{x.production_country or ''}}" placeholder="Страна производства"><input name="hall" value="{{x.hall or ''}}" placeholder="Зал"><input name="rack" value="{{x.rack or ''}}" placeholder="Стеллаж"><input name="display_case" value="{{x.display_case or ''}}" placeholder="Витрина"><input name="shelf" value="{{x.shelf or ''}}" placeholder="Полка"><input name="slot" value="{{x.slot or ''}}" placeholder="Слот"><button class="primary">Сохранить</button></form>{% endfor %}</main></body></html>
