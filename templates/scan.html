{% extends "base.html" %}

{% block content %}

<div class="page">
    <p class="eyebrow">ВИЗУАЛЬНОЕ РАСПОЗНАВАНИЕ</p>

    <h1>Сканер экспонатов</h1>

    <p class="muted">
        Проверяем только коллекцию музея.
        Интернет-поиск доступен хранителю при добавлении экспоната.
    </p>
</div>

<section class="scanner">

    <div class="frame" id="scannerFrame">

        <img
            id="preview"
            alt="Выбранное фото"
            hidden
        >

        <span id="framePlus">＋</span>

        <i id="frameCorners"></i>

        <small id="frameText">
            ПОМЕСТИТЕ ИГРУШКУ В КАДР
        </small>

        <label class="upload-inside">
            Загрузить фото

            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/*"
                capture="environment"
            >
        </label>

    </div>

    <form id="scanform">

        <button
            class="primary"
            type="submit"
            id="recognizeButton"
            disabled>
            Распознать экспонат
        </button>

    </form>

    <p id="status" class="status"></p>

</section>

<section id="results" hidden>

    <div class="heading">
        <h2 id="result-title">Результаты</h2>
    </div>

    <div id="body"></div>

</section>

<style>

#scannerFrame {
    position: relative;
    overflow: hidden;
}

#preview {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 1;
}

#scannerFrame > span,
#scannerFrame > i,
#scannerFrame > small {
    position: relative;
    z-index: 3;
}

.upload-inside {
    position: absolute;

    left: 50%;
    bottom: 24px;

    transform: translateX(-50%);

    z-index: 10;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 12px 22px;

    border-radius: 12px;

    background: rgba(0, 0, 0, 0.65);

    color: #fff;

    font-size: 14px;

    cursor: pointer;

    white-space: nowrap;

    backdrop-filter: blur(8px);
}

.upload-inside:hover {
    background: rgba(0, 0, 0, 0.8);
}

.upload-inside input {
    display: none;
}

#scannerFrame.has-photo #frameText,
#scannerFrame.has-photo #framePlus,
#scannerFrame.has-photo #frameCorners {
    display: none;
}

#recognizeButton:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

</style>

<script>

const form = document.querySelector('#scanform');

const photoInput = document.querySelector('#photo');

const preview = document.querySelector('#preview');

const scannerFrame =
    document.querySelector('#scannerFrame');

const recognizeButton =
    document.querySelector('#recognizeButton');

const status =
    document.querySelector('#status');

const results =
    document.querySelector('#results');

const body =
    document.querySelector('#body');

const resultTitle =
    document.querySelector('#result-title');


/* =====================================================
   ВЫБОР ФОТО
   ===================================================== */

photoInput.addEventListener('change', function () {

    const file = this.files && this.files[0];

    if (!file) {
        return;
    }

    preview.src = URL.createObjectURL(file);

    preview.hidden = false;

    scannerFrame.classList.add('has-photo');

    recognizeButton.disabled = false;

    status.textContent =
        'Фото готово к анализу.';

    results.hidden = true;

});


/* =====================================================
   РАСПОЗНАВАНИЕ
   ===================================================== */

form.addEventListener('submit', async function (e) {

    e.preventDefault();

    const file =
        photoInput.files && photoInput.files[0];

    if (!file) {

        status.textContent =
            'Сначала загрузите фотографию.';

        return;
    }

    recognizeButton.disabled = true;

    status.textContent =
        'Сначала проверяем базу музея…';

    results.hidden = true;

    const fd = new FormData();

    fd.append('photo', file);

    try {

        const response = await fetch(
            '/api/scan',
            {
                method: 'POST',
                body: fd
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                'Ошибка сервера.'
            );
        }

        status.textContent =
            data.message || '';

        results.hidden = false;


        /* =================================================
           ЗАГОЛОВОК РЕЗУЛЬТАТА
           ================================================= */

        if (data.mode === 'database') {

            resultTitle.textContent =
                'Похожие экспонаты';

        } else {

            resultTitle.textContent =
                'Нет подтверждённого совпадения';

        }


        /* =================================================
           РЕЗУЛЬТАТЫ ИЗ БАЗЫ
           ================================================= */

        if (
            Array.isArray(data.matches) &&
            data.matches.length
        ) {

            body.innerHTML =

                '<div class="grid">' +

                data.matches.map(m => {

                    const toy = m.toy || {};

                    const image = toy.image_path
                        ? `
                            <img
                                src="/photos/${esc(toy.image_path)}"
                                alt=""
                            >
                          `
                        : '✦';

                    return `

                        <a
                            class="toy"
                            href="/toy/${encodeURIComponent(toy.id)}">

                            <div class="thumb">
                                ${image}
                            </div>

                            <div class="toyinfo">

                                <small>
                                    ${esc(toy.inventory_number)}
                                    · визуальное сходство
                                    ${Math.round(
                                        Number(m.score || 0) * 100
                                    )}%
                                </small>

                                <h3>
                                    ${esc(toy.name)}
                                </h3>

                                <p>
                                    ${esc(toy.brand)}
                                    ·
                                    ${esc(toy.height)}
                                </p>

                            </div>

                        </a>

                    `;

                }).join('') +

                '</div>';

        } else {

            body.innerHTML = `

                <div class="empty">

                    ${esc(
                        data.detail ||
                        'В коллекции музея совпадение не найдено.'
                    )}

                </div>

            `;

        }

    } catch (error) {

        console.error(
            'SCAN ERROR:',
            error
        );

        status.textContent =
            error.message ||
            'Ошибка соединения. Попробуйте ещё раз.';

        results.hidden = true;

    } finally {

        recognizeButton.disabled = false;

    }

});


/* =====================================================
   БЕЗОПАСНЫЙ ВЫВОД ТЕКСТА
   ===================================================== */

function esc(value) {

    return String(value ?? '').replace(
        /[&<>"']/g,
        function (char) {

            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'

            }[char];

        }
    );

}

</script>

{% endblock %}
