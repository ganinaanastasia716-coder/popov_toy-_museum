<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><title>Сканер — TOY MUSEUM</title></head>
<body><main class="app">
<header class="topbar"><a class="brand" href="/">TOY MUSEUM</a><a class="profile" href="/admin/login">◯</a></header>
<div class="page scan-page"><a class="back" href="/">‹ Главная</a><div class="eyebrow">УМНЫЙ ПОИСК</div><h1 class="page-title">Найти экспонат</h1><p class="page-subtitle">Сфотографируйте игрушку или выберите фотографию из галереи.</p>
<div class="scanner-card"><div class="scanner-frame"><div class="scan-line"></div><div class="scanner-mark">M</div></div><div id="status" class="scan-status">Готов к сканированию</div>
<div class="scan-actions"><label class="scan-button primary">📷 Камера<input id="camera" type="file" accept="image/*" capture="environment" hidden></label><label class="scan-button">▣ Галерея<input id="gallery" type="file" accept="image/*" hidden></label></div></div>
<div class="section-head"><h2>Похожие экспонаты</h2></div><div id="results" class="results"></div></div>
<nav class="bottom-nav"><a href="/"><span>⌂</span>Главная</a><a class="active" href="/scan"><span>⌕</span>Поиск</a><a href="#"><span>♡</span>Избранное</a><a href="/admin/login"><span>◉</span>Профиль</a></nav></main>
<script>
const status=document.getElementById('status'), results=document.getElementById('results');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function card(t){const img=t.photo_path?'/photos/'+encodeURIComponent(String(t.photo_path).split(/[\\/]/).pop()):'/placeholder.svg'; return `<a class="result-card" href="/toy/${t.id}"><img src="${img}" onerror="this.src='/placeholder.svg'" alt=""><div><h3>${esc(t.title||'Экспонат без названия')}</h3><span class="pill">${esc(t.inventory_num||'INV —')}</span>${t.format?`<span class="pill">${esc(t.format)}</span>`:''}${t.height_cm?`<span class="pill">${esc(t.height_cm)} см</span>`:''}<div class="similarity">Похожесть ${esc(t.similarity)}% · Открыть паспорт ›</div></div></a>`}
async function send(file){if(!file)return; status.textContent='Сканируем коллекцию…'; results.innerHTML=''; const fd=new FormData(); fd.append('photo',file); try{const r=await fetch('/api/search-photo',{method:'POST',body:fd}); const j=await r.json(); if(!j.ok) throw new Error(j.error||'Ошибка'); status.textContent=j.count?`Найдено похожих экспонатов: ${j.count}`:'В базе пока нет фотографий для сравнения'; results.innerHTML=(j.results||[]).map(card).join('')}catch(e){status.textContent=e.message}}
document.getElementById('camera').addEventListener('change',e=>send(e.target.files[0])); document.getElementById('gallery').addEventListener('change',e=>send(e.target.files[0]));
</script></body></html>
