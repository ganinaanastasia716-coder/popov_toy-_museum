<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Фотосканер · TOY MUSEUM</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="app-shell plain"><header class="page-top"><a href="/">‹</a><div><span class="eyebrow">SMART SCANNER</span><h1>Поиск по фото</h1></div></header><section class="content scanner-page"><div class="scanner-hero"><div class="scanner-grid"></div><div class="scanner-line"></div><div class="scanner-cross">+</div></div><h2>Найдём похожий экспонат</h2><p class="muted">Сфотографируйте фигурку целиком. Фото пользователя не сохраняется в музейный каталог.</p><label class="scan-button" for="scan-input">📷 Открыть камеру / выбрать фото</label><input id="scan-input" type="file" accept="image/*" capture="environment" hidden><div id="scan-results"></div></section><script>
const input=document.getElementById('scan-input'), out=document.getElementById('scan-results');
input.onchange=async()=>{if(!input.files[0])return;out.innerHTML='<div class="scan-toast">◌ Сканирую коллекцию…</div>';const fd=new FormData();fd.append('photo',input.files[0]);try{const r=await fetch('/api/search-photo',{method:'POST',body:fd});const d=await r.json();if(!d.ok||!d.matches.length){out.innerHTML='<div class="empty">Совпадений нет.<br>Попробуйте другой ракурс.</div>';return;}out.innerHTML='<div class="scan-match-title">Лучшие совпадения</div>'+d.matches.map((m,i)=>`<a class="scan-result" href="${m.url}"><div class="result-image">${m.photo?`<img src="${m.photo}">`:''}</div><div><small>${m.inventory_num||''} · ${(m.score*100).toFixed(1)}%</small><strong>${m.title||'Без названия'}</strong><span>${m.hall||'Зал не указан'} · ${m.rack||'Стеллаж не указан'} · полка ${m.shelf||'—'} · слот ${m.slot||'—'}</span></div><b>›</b></a>`).join('');}catch(e){out.innerHTML='<div class="empty">Сканер временно недоступен.</div>';}};
</script></main></body></html>
