{% extends "base.html" %}

{% block content %}

<div class="page scan-page">

    <p class="eyebrow">ВИЗУАЛЬНОЕ РАСПОЗНАВАНИЕ</p>

    <h1>Сканер экспонатов</h1>

    <p class="muted">
        Наведите камеру на игрушку или загрузите фотографию.
        Проверяем только коллекцию музея.
    </p>

</div>


<section class="scanner">

    <!-- =================================================
         ОБЛАСТЬ КАМЕРЫ
         ================================================= -->

    <div
        class="scanner-camera"
        id="scannerCamera"
    >

        <video
            id="camera"
            autoplay
            playsinline
            muted
        ></video>


        <!-- ФОТО ПОСЛЕ СНИМКА / ЗАГРУЗКИ -->

        <img
            id="preview"
            alt="Фотография экспоната"
            hidden
        >


        <!-- СКАНИРУЮЩАЯ РАМКА -->

        <div
            class="scan-overlay"
            id="scanOverlay"
        >

            <div class="scan-corners"></div>

            <div
                class="scan-line"
                id="scanLine"
            ></div>

        </div>


        <!-- ТЕКСТ ВНУТРИ КАМЕРЫ -->

        <div
            class="camera-hint"
            id="cameraHint"
        >
            Наведите камеру на игрушку
        </div>


        <!-- CANVAS ДЛЯ ФОТО -->

        <canvas
            id="captureCanvas"
            hidden
        ></canvas>

    </div>


    <!-- =================================================
         УПРАВЛЕНИЕ
         ================================================= -->

    <div class="scanner-controls">

        <!-- ЗАГРУЗИТЬ ГОТОВОЕ ФОТО -->

        <label
            class="file-button"
            for="photo"
        >
            Добавить файл

            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/*"
            >
        </label>


        <!-- СДЕЛАТЬ СНИМОК -->

        <button
            type="button"
            class="camera-button"
            id="takePhoto"
        >
            Сделать снимок
        </button>

    </div>


    <!-- =================================================
         РАСПОЗНАТЬ
         ================================================= -->

    <form id="scanform">

        <button
            type="submit"
            class="primary recognize-button"
            id="recognizeButton"
            disabled
        >
            Распознать экспонат
        </button>

    </form>


    <p
        id="status"
        class="status"
        aria-live="polite"
    ></p>

</section>


<!-- =====================================================
     РЕЗУЛЬТАТЫ
     ===================================================== -->

<section
    id="results"
    class="scan-results"
    hidden
>

    <div class="heading">

        <h2 id="result-title">
            Результаты
        </h2>

    </div>

    <div id="body"></div>

</section>


<style>

/* =====================================================
   ОСНОВНОЙ СКАНЕР
   ===================================================== */

.scanner {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
}


/* =====================================================
   КАМЕРА
   ===================================================== */

.scanner-camera {
    position: relative;

    width: 100%;

    aspect-ratio: 4 / 3;

    overflow: hidden;

    border-radius: 24px;

    background: #080808;
}


/* ЖИВАЯ КАМЕРА */

#camera {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 1;
}


/* ФОТО */

#preview {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 4;
}


/* =====================================================
   РАМКА СКАНИРОВАНИЯ
   ===================================================== */

.scan-overlay {
    position: absolute;

    inset: 0;

    z-index: 3;

    pointer-events: none;
}


/* Углы */

.scan-corners {
    position: absolute;

    left: 12%;
    right: 12%;

    top: 12%;
    bottom: 12%;

    border: 1px solid rgba(255,255,255,.65);

    border-radius: 18px;
}


/* Сканирующая линия */

.scan-line {
    position: absolute;

    left: 13%;
    right: 13%;

    top: 15%;

    height: 1px;

    background: rgba(255,255,255,.8);

    animation: scanMove 2.8s ease-in-out infinite;
}


@keyframes scanMove {

    0% {
        top: 15%;
        opacity: .25;
    }

    50% {
        top: 82%;
        opacity: .9;
    }

    100% {
        top: 15%;
        opacity: .25;
    }

}


/* =====================================================
   ТЕКСТ НА КАМЕРЕ
   ===================================================== */

.camera-hint {
    position: absolute;

    left: 50%;
    bottom: 28px;

    transform: translateX(-50%);

    z-index: 5;

    width: max-content;
    max-width: 90%;

    padding: 8px 14px;

    border-radius: 10px;

    background: rgba(0,0,0,.5);

    color: #fff;

    font-size: 13px;

    text-align: center;

    backdrop-filter: blur(8px);
}


/* =====================================================
   КНОПКИ ПОД КАМЕРОЙ
   ===================================================== */

.scanner-controls {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 12px;

    margin-top: 18px;

}


/* Общий стиль */

.file-button,
.camera-button {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-height: 44px;

    padding: 11px 18px;

    border-radius: 12px;

    border: 1px solid rgba(255,255,255,.16);

    background: rgba(255,255,255,.06);

    color: inherit;

    font: inherit;

    cursor: pointer;

    transition:
        background .2s ease,
        transform .2s ease;
}


.file-button:hover,
.camera-button:hover {

    background: rgba(255,255,255,.1);

    transform: translateY(-1px);

}


/* Настоящий input скрыт */

.file-button input {

    position: absolute;

    width: 1px;
    height: 1px;

    opacity: 0;

    pointer-events: none;

}


/* =====================================================
   РАСПОЗНАТЬ
   ===================================================== */

.recognize-button {

    display: block;

    width: 100%;

    margin-top: 14px;
}


.recognize-button:disabled {

    opacity: .4;

    cursor: not-allowed;

}


/* =====================================================
   СТАТУС
   ===================================================== */

.status {

    min-height: 24px;

    margin: 14px 0 0;

    text-align: center;

}


/* =====================================================
   РЕЗУЛЬТАТЫ
   ===================================================== */

.scan-results {

    max-width: 1000px;

    margin: 36px auto 0;

}


/* =====================================================
   СОСТОЯНИЕ ПОСЛЕ ФОТО
   ===================================================== */

.scanner-camera.has-photo .scan-overlay {

    display: none;

}


.scanner-camera.has-photo .camera-hint {

    display: none;

}


/* =====================================================
   МОБИЛЬНЫЕ
   ===================================================== */

@media (max-width: 600px) {

    .scanner-camera {

        aspect-ratio: 3 / 4;

        border-radius: 18px;

    }


    .scan-corners {

        left: 8%;
        right: 8%;

        top: 10%;
        bottom: 10%;

    }


    .scan-line {

        left: 9%;
        right: 9%;

    }


    .scanner-controls {

        gap: 8px;

    }


    .file-button,
    .camera-button {

        flex: 1;

        padding-left: 10px;
        padding-right: 10px;

        font-size: 13px;

    }

}


/* Очень маленький экран */

@media (max-width: 380px) {

    .scanner-controls {

        flex-direction: column;

    }


    .file-button,
    .camera-button {

        width: 100%;

    }

}

</style>


<script>

/* =====================================================
   ЭЛЕМЕНТЫ
   ===================================================== */

const camera =
    document.getElementById("camera");

const preview =
    document.getElementById("preview");

const canvas =
    document.getElementById("captureCanvas");

const scannerCamera =
    document.getElementById("scannerCamera");

const cameraHint =
    document.getElementById("cameraHint");

const photoInput =
    document.getElementById("photo");

const takePhotoButton =
    document.getElementById("takePhoto");

const form =
    document.getElementById("scanform");

const recognizeButton =
    document.getElementById("recognizeButton");

const status =
    document.getElementById("status");

const results =
    document.getElementById("results");

const resultTitle =
    document.getElementById("result-title");

const body =
    document.getElementById("body");


/* =====================================================
   СОСТОЯНИЕ
   ===================================================== */

let cameraStream = null;

let selectedFile = null;

let previewUrl = null;


/* =====================================================
   ЗАПУСК КАМЕРЫ
   ===================================================== */

async function startCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        cameraHint.textContent =
            "Камера недоступна. Добавьте фотографию.";

        takePhotoButton.disabled =
            true;

        return;

    }


    try {

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }

                },

                audio: false

            });


        camera.srcObject =
            cameraStream;


        await camera.play();


        cameraHint.textContent =
            "Наведите камеру на игрушку";


    } catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );


        cameraHint.textContent =
            "Разрешите доступ к камере или добавьте файл";


        takePhotoButton.disabled =
            true;

    }

}


/* =====================================================
   СДЕЛАТЬ СНИМОК
   ===================================================== */

takePhotoButton.addEventListener(
    "click",
    function () {

        if (
            !cameraStream ||
            camera.readyState < 2
        ) {

            status.textContent =
                "Камера ещё не готова.";

            return;

        }


        const width =
            camera.videoWidth;

        const height =
            camera.videoHeight;


        if (!width || !height) {

            status.textContent =
                "Не удалось получить изображение с камеры.";

            return;

        }


        canvas.width =
            width;

        canvas.height =
            height;


        const context =
            canvas.getContext("2d");


        context.drawImage(
            camera,
            0,
            0,
            width,
            height
        );


        canvas.toBlob(
            function (blob) {

                if (!blob) {

                    status.textContent =
                        "Не удалось сделать снимок.";

                    return;

                }


                selectedFile =
                    new File(
                        [blob],
                        "scan.jpg",
                        {
                            type: "image/jpeg"
                        }
                    );


                showPreview(
                    selectedFile
                );


                status.textContent =
                    "Фото готово к анализу.";

            },
            "image/jpeg",
            0.92
        );

    }
);


/* =====================================================
   ДОБАВЛЕНИЕ ФАЙЛА
   ===================================================== */

photoInput.addEventListener(
    "change",
    function () {

        const file =
            this.files &&
            this.files[0];


        if (!file) {
            return;
        }


        if (
            !file.type.startsWith("image/")
        ) {

            status.textContent =
                "Можно добавить только изображение.";

            this.value =
                "";

            return;

        }


        selectedFile =
            file;


        showPreview(
            file
        );


        status.textContent =
            "Фото готово к анализу.";

    }
);


/* =====================================================
   ПОКАЗАТЬ ФОТО
   ===================================================== */

function showPreview(file) {

    if (previewUrl) {

        URL.revokeObjectURL(
            previewUrl
        );

    }


    previewUrl =
        URL.createObjectURL(
            file
        );


    preview.src =
        previewUrl;


    preview.hidden =
        false;


    scannerCamera.classList.add(
        "has-photo"
    );


    recognizeButton.disabled =
        false;


    /* Останавливаем камеру,
       когда фото уже получено */

    stopCamera();

}


/* =====================================================
   ОСТАНОВИТЬ КАМЕРУ
   ===================================================== */

function stopCamera() {

    if (!cameraStream) {
        return;
    }


    cameraStream
        .getTracks()
        .forEach(
            function (track) {

                track.stop();

            }
        );


    cameraStream =
        null;

}


/* =====================================================
   РАСПОЗНАВАНИЕ
   ===================================================== */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        if (!selectedFile) {

            status.textContent =
                "Сначала сделайте снимок или добавьте файл.";

            return;

        }


        recognizeButton.disabled =
            true;


        recognizeButton.textContent =
            "Проверяем…";


        status.textContent =
            "Проверяем коллекцию музея…";


        results.hidden =
            true;


        const formData =
            new FormData();


        formData.append(
            "photo",
            selectedFile
        );


        try {

            const response =
                await fetch(
                    "/api/scan",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            let data;


            try {

                data =
                    await response.json();

            } catch (error) {

                throw new Error(
                    "Сервер вернул некорректный ответ."
                );

            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    data.message ||
                    "Ошибка распознавания."
                );

            }


            status.textContent =
                data.message ||
                "Проверка завершена.";


            results.hidden =
                false;


            if (
                data.mode === "database"
            ) {

                resultTitle.textContent =
                    "Найдено в коллекции";

            } else {

                resultTitle.textContent =
                    "Экспонат не найден";

            }


            if (
                Array.isArray(data.matches) &&
                data.matches.length
            ) {

                body.innerHTML =

                    '<div class="grid">' +

                    data.matches
                        .map(function (match) {

                            const toy =
                                match.toy || {};


                            const score =
                                Math.round(
                                    Number(
                                        match.score || 0
                                    ) * 100
                                );


                            const image =
                                toy.image_path

                                    ? `

                                        <img
                                            src="/photos/${esc(
                                                toy.image_path
                                            )}"
                                            alt="${esc(
                                                toy.name
                                            )}"
                                            loading="lazy"
                                        >

                                      `

                                    : "✦";


                            return `

                                <a
                                    class="toy"
                                    href="/toy/${encodeURIComponent(
                                        toy.id
                                    )}"
                                >

                                    <div class="thumb">

                                        ${image}

                                    </div>


                                    <div class="toyinfo">

                                        <small>

                                            ${esc(
                                                toy.inventory_number
                                            )}

                                            · визуальное сходство

                                            ${score}%

                                        </small>


                                        <h3>

                                            ${esc(
                                                toy.name
                                            )}

                                        </h3>


                                        <p>

                                            ${esc(
                                                toy.brand
                                            )}

                                            ·

                                            ${esc(
                                                toy.height
                                            )}

                                        </p>

                                    </div>

                                </a>

                            `;

                        })
                        .join("") +

                    "</div>";

            } else {

                body.innerHTML = `

                    <div class="empty">

                        ${esc(
                            data.detail ||
                            "В коллекции музея совпадение не найдено."
                        )}

                    </div>

                `;

            }


            results.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });


        } catch (error) {

            console.error(
                "SCAN ERROR:",
                error
            );


            status.textContent =
                error.message ||
                "Ошибка соединения. Попробуйте ещё раз.";


            results.hidden =
                true;

        } finally {

            recognizeButton.disabled =
                false;

            recognizeButton.textContent =
                "Распознать экспонат";

        }

    }
);


/* =====================================================
   БЕЗОПАСНЫЙ ТЕКСТ
   ===================================================== */

function esc(value) {

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        function (char) {

            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char];

        }
    );

}


/* =====================================================
   ЗАПУСК
   ===================================================== */

startCamera();


/* =====================================================
   УБИРАЕМ КАМЕРУ ПРИ УХОДЕ СО СТРАНИЦЫ
   ===================================================== */

window.addEventListener(
    "pagehide",
    stopCamera
);

</script>

{% endblock %}
