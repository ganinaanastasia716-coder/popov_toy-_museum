{% extends "base.html" %}{% block content %}<div class="page"><p class="eyebrow">ВИЗУАЛЬНОЕ РАСПОЗНАВАНИЕ</p><h1>Сканер экспонатов</h1><p class="muted">Проверяем только коллекцию музея. Интернет-поиск доступен хранителю при добавлении экспоната.</p></div><section class="scanner"><div class="frame"><span>＋</span><i></i><small>ПОМЕСТИТЕ ИГРУШКУ В КАДР</small></div><form id="scanform"><label class="upload">📷 Снять фото или выбрать из галереи<input type="file" name="photo" id="photo" accept="image/*" capture="environment" required></label><img id="preview" hidden><button class="primary">Распознать экспонат ↗</button></form><p id="status" class="status"></p></section><section id="results" hidden><div class="heading"><h2 id="result-title">Результаты</h2></div><div id="body"></div></section><script>
const f=document.querySelector('#photo'),p=document.querySelector('#preview'),s=document.querySelector('#status'),out=document.querySelector('#results'),body=document.querySelector('#body');
f.onchange=()=>{if(f.files[0]){p.src=URL.createObjectURL(f.files[0]);p.hidden=false;s.textContent='Фото готово к анализу.'}};
document.querySelector('#scanform').onsubmit=async e=>{e.preventDefault();s.textContent='Сначала проверяем базу музея…';out.hidden=true;let fd=new FormData();fd.append('photo',f.files[0]);try{let r=await fetch('/api/scan',{method:'POST',body:fd}),d=await r.json();s.textContent=d.message||d.error;out.hidden=false;document.querySelector('#result-title').textContent=d.mode==='database'?'Похожие экспонаты':d.mode==='online'?'Онлайн-досье':'Нет подтверждённого совпадения';if(d.matches?.length){body.innerHTML='<div class="grid">'+d.matches.map(m=>`<a class="toy" href="/toy/${m.toy.id}"><div class="thumb">${m.toy.image_path?`<img src="/photos/${m.toy.image_path}" alt="">`:'✦'}</div><div class="toyinfo"><small>${esc(m.toy.inventory_number)} · визуальное сходство ${Math.round(m.score*100)}%</small><h3>${esc(m.toy.name)}</h3><p>${esc(m.toy.brand)} · ${esc(m.toy.height)}</p></div></a>`).join('')+'</div>'}else if(d.dossier){let x=d.dossier;body.innerHTML='<div class="online"><h2>'+esc(x.name||'Игрушка не определена')+'</h2><div class="specs">'+[['Серия',x.series],['Бренд',x.brand],['Автор',x.author],['Редкость',x.rarity],['Размер',x.height],['Год',x.release_year],['Материал',x.material],['Страна',x.production_country],['Цена',x.market_price],['Описание',x.description]].map(a=>`<div><small>${a[0]}</small><b>${esc(a[1]||'Не указано')}</b></div>`).join('')+'</div><p>Это предварительное досье, оно не добавлено в музей автоматически.</p><h3>Источники</h3>'+((x.sources||[]).map(a=>`<p><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title||a.url)}</a></p>`).join('')||'Источники не получены')+'</div>'}else body.innerHTML='<div class="empty">'+esc(d.detail||'Для онлайн-поиска настройте GEMINI_API_KEY в окружении.')+'</div>'}catch(e){s.textContent='Ошибка соединения. Попробуйте ещё раз.'}};
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>{% endblock %}
