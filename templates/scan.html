<!doctype html><html lang="ru"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="phone"><header><a href="/">←</a><b>ФОТОСКАНЕР</b></header><section class="scanner"><div class="scan-frame"><span></span></div><h1>Найти экспонат</h1><p>Сфотографируйте игрушку или выберите фото из галереи</p><input id="photo" type="file" accept="image/*" capture="environment"><button class="primary" onclick="scan()">🔍 Начать поиск</button></section><div id="results" class="results"></div><nav><a href="/">Главная</a><a class="active" href="/scan">Поиск</a><a href="#">Избранное</a><a href="#">Профиль</a></nav></main><script>async function scan(){const f=document.getElementById('photo').files[0];if(!f)return alert('Выберите или снимите фото');let d=new FormData();d.append('photo',f);let r=await fetch('/api/search-photo',{method:'POST',body:d});let j=await r.json();let el=document.getElementById('results');el.innerHTML=j.results?.map(x=>`<a class="result" href="/toy/${x.id}"><img src="/photos/${encodeURIComponent(x.photo_path.split(/[\\/]/).pop())}"><div><b>${x.title||'Экспонат'}</b><small>${x.inventory_num||''}</small><span>Размер: ${x.format||'—'} · ${x.height_cm||'—'} см</span><small>Сходство ${x.similarity}%</small></div></a>`).join('')||'<p>Совпадений пока нет.</p>'}</script></body></html>
