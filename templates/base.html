<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b10"><title>{% block title %}Popov Toy Museum{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="shell"><header class="topbar"><a class="brandmark" href="/"><span class="brand-glyph">◈</span><span class="brand-type">Popov Toy <b>Museum</b><small>COLLECT · DISCOVER · PRESERVE</small></span></a><a class="keeper-link" href="/admin/login"><span>♙</span><span>Хранитель</span></a></header><main>{% with ms=get_flashed_messages() %}{% if ms %}<div class="flash">{{ms|join(' · ')}}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main><nav class="nav"><a class="{% if request.path=='/' %}active{% endif %}" href="/"><span>⌂</span><small>Главная</small></a><a class="{% if request.path.startswith('/scan') %}active{% endif %}" href="/scan"><span>◎</span><small>Сканер</small></a><a class="{% if request.path.startswith('/collection') or request.path.startswith('/toy/') %}active{% endif %}" href="/collection"><span>▤</span><small>Коллекция</small></a><a class="{% if request.path.startswith('/admin') %}active{% endif %}" href="/admin/login"><span>♙</span><small>Профиль</small></a></nav></div></body></html>
